services:
  - type: web
    name: limit-state-vyrox
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISABLE_HMR
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: vyrox-postgres
          property: connectionString

databases:
  - name: vyrox-postgres
    databaseName: vyrox_cloud
    user: vyrox
    plan: free
